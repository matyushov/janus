[package]
name = "janus-ffi"
description = "C ABI of the janus client SDK (libjanus): embeds the client core into any application. The C++ wrapper lives in include/janus/janus.hpp."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "janus"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
janus-client = { path = "../janus-client" }
janus-lib = { path = "../janus-lib", features = ["backend-grpc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
