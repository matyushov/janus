language = "C"
include_guard = "JANUS_JANUS_H"
cpp_compat = true
usize_is_size_t = true
after_includes = """

/* JANUS_API: decoration of the exported functions (dllimport when using the DLL on Windows). */
#ifndef JANUS_API
#  if defined(_WIN32) && defined(JANUS_SHARED)
#    define JANUS_API __declspec(dllimport)
#  else
#    define JANUS_API
#  endif
#endif"""
header = "/* libjanus C ABI. GENERATED by cbindgen from crates/janus-ffi/src/lib.rs; do not edit. */"
documentation = true
documentation_style = "c99"
style = "type"

[parse]
parse_deps = false

[export]
include = []

[fn]
prefix = "JANUS_API"

[defines]
