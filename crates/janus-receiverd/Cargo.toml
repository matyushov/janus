[package]
name = "janus-receiverd"
description = "janus receiver server: gRPC → files in the store. Router (network, mTLS) / StoreWorker (no network, own store only)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
janus-proto = { path = "../janus-proto" }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# mTLS: rustls with the `ring` provider only (no aws-lc-rs: it needs a C toolchain/NASM on
# Windows). TLS 1.3 only: `tls12` is deliberately not enabled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
# Test certificate generation (feature `test-support`, used by this crate's tests and janus-lib's).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"], optional = true }
# TODO: cap-std (confined Dir)

[features]
test-support = ["dep:rcgen"]

[dev-dependencies]
janus-receiverd = { path = ".", features = ["test-support"] }

# --- .deb package (cargo-deb) --------------------------------------------
# Build: cargo deb -p janus-receiverd   (needs a Linux host; see packaging/README.md)
[package.metadata.deb]
name = "janus-receiverd"
maintainer = "Alexander Matyushov <matyushov.a.a@gmail.com>"
copyright = "2026, Alexander Matyushov"
license-file = ["../../LICENSE", "0"]
extended-description = """\
janus receiving side: accepts band files over gRPC and writes them to the store.
Runs as the unprivileged user janus; the systemd unit is hardened.
Certificates and store data are not included in the package."""
section = "utils"
priority = "optional"
# NB: asset paths are resolved FROM THE CRATE DIRECTORY, except "target/release/…",
# which cargo-deb treats as the workspace target (otherwise the binary is not found).
assets = [
    ["target/release/janus-receiverd", "usr/bin/", "755"],
    ["../../packaging/systemd/janus-receiverd.service", "lib/systemd/system/", "644"],
    ["../../packaging/systemd/janus-sysusers.conf", "usr/lib/sysusers.d/janus.conf", "644"],
    ["../../packaging/systemd/janus-tmpfiles.conf", "usr/lib/tmpfiles.d/janus.conf", "644"],
    ["../../packaging/systemd/janus-receiverd.env", "etc/janus/receiverd.env", "640"],
    ["../../README.md", "usr/share/doc/janus-receiverd/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/janus-receiverd/LICENSE", "644"],
]
# Admin edits survive a package upgrade.
conf-files = ["/etc/janus/receiverd.env"]
maintainer-scripts = "../../packaging/deb/"
# The unit is installed as an asset (above) and is NOT enabled automatically: without a config
# and certificates the service is useless, so the administrator does the enable.
