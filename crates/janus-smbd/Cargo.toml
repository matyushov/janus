[package]
name = "janus-smbd"
description = "macOS LaunchDaemon: local SMB endpoint for Time Machine. Glue only — all logic lives in janus-lib/smb-core."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
janus-client = { path = "../janus-client" }
janus-lib = { path = "../janus-lib", features = ["backend-grpc"] }
