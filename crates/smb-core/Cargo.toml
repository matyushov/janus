[package]
name = "smb-core"
description = "SMB server core: connections, sessions, handle tables, durable/lease semantics, Apple extensions. All protocol state and I/O."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
smb-wire = { path = "../smb-wire" }
janus-lib = { path = "../janus-lib" }
tokio = { workspace = true }
# FuturesUnordered: READ/WRITE backend calls of one connection run concurrently.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"

[dev-dependencies]
sha2 = "0.10"
