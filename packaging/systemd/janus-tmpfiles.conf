# The janus directories and their permissions.
# Installed to /usr/lib/tmpfiles.d/janus.conf.
#
# /etc/janus        — config and certificates: read by janus, edited by root.
# /var/lib/janus    — state (the receiver's store, the gateway's WAL): janus only.
# /run/janus        — daemon control sockets (0750, so the CLI works under root).

d /etc/janus         0750 root  janus -
d /etc/janus/tls     0750 root  janus -
d /var/lib/janus     0700 janus janus -
d /var/lib/janus/store 0700 janus janus -
d /var/lib/janus/smbd  0700 janus janus -
d /run/janus         0750 janus janus -
